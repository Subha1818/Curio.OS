<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <filter id="pixelShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#00f0ff" flood-opacity="0.8" />
      <feDropShadow dx="-1" dy="1" stdDeviation="0" flood-color="#ff007f" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#pixelShadow)">
    <!-- Black pixel border -->
    <path d="M0 0h2v18h2v-2h2v-2h2v-2h2v-2h2v-2h2v-2h2v-2h-14v-4z" fill="#000000"/>
    <path d="M0 0h2v24h4v-4h2v-2h2v-2h4v2h2v-4h-2v-2h-2v-2h-2v-2h-2v-2h-2v-2h-4v-2z" fill="#000000"/>
    <!-- Tail -->
    <path d="M6 18h4v2h-4z M10 20h4v2h-4z M12 22h4v4h-4z M8 16h4v2h-4z" fill="#000000"/>
    
    <!-- White Pixel Body -->
    <path d="M2 2h2v18h2v-2h2v-2h2v-2h2v-2h2v-2h2v-2h2v-2h-14v-4z" fill="#ffffff"/>
    <path d="M2 2h2v20h2v-2h2v-2h2v-2h2v-2h2v-2h2v-2h-10v-8z" fill="#ffffff"/>
    <path d="M8 18h2v4h2v-2h-2v-2h-2z" fill="#ffffff"/>
    <path d="M12 20h2v4h-2z" fill="#ffffff"/>
    
    <!-- Neon cyan inner highlight -->
    <rect x="3" y="3" width="2" height="12" fill="#22d3ee"/>
    <rect x="5" y="5" width="2" height="8" fill="#a5f3fc"/>
  </g>
</svg>
